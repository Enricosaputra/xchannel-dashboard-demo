# The dashboard with MySQL, the database production uses.
# docker compose up --build, then open http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: xchannel_demo
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: xchannel_demo
      DB_USERNAME: root
      DB_PASSWORD: secret
      DEMO_RESET_HOURS: 3
    depends_on:
      db:
        condition: service_healthy
